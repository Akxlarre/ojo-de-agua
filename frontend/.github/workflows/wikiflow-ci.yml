name: wikiflow-ci

# CI base generado por Koa Agent CLI / Wikiflow.
# Propósito: validar en cada PR que el proyecto mantiene la arquitectura canónica
# (lint angular + lint arquitectónico + build). No ejecuta deploys.
#
# Sprint 7 expandirá este workflow con matrix de despliegues (Vercel/Supabase).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs antiguos del mismo branch cuando se empuja nuevo commit.
concurrency:
  group: wikiflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify architecture & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Angular)
        run: npm run lint --if-present

      - name: Lint (Architecture)
        run: npm run lint:arch --if-present

      - name: Build
        run: npm run build --if-present
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      # Opcional: tests cuando existan.
      - name: Test
        run: npm test --if-present -- --watch=false --browsers=ChromeHeadless
        continue-on-error: false

  # Placeholder para Sprint 7 — completar cuando se implemente GitHub Layer 2.
  # deploy:
  #   needs: verify
  #   if: github.ref == 'refs/heads/main'
  #   ...
